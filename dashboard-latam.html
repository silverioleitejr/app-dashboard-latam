<style>
  /* ===== Tokens do DESIGN-SYSTEM.md ===== */
  :root {
    --white: #ffffff;  --pure-black: #000000;  --grey-900: #21201f;
    --og1-grey-700: #544f4f;  --grey-500: #9d948e;  --og1-grey-300: #dbd6d1;
    --og1-blue: #0b41cd;  --error-red: #ff1f26;
    --radius-sm: 6px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 40px; --s8: 48px;
    --card-shadow: 0 2px 4px rgba(0, 0, 0, .11);
    --hero-gradient: linear-gradient(136.47deg, #fff 35.41%, #fff7f5 58%, #bde3ff 128.14%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--white); color: var(--pure-black); font-family: sans-serif; font-weight: 400; }

  /* Global Header (azul) */
  .global-header { background: var(--og1-blue); color: var(--white); padding: var(--s3) var(--s6);
    font-size: 18px; line-height: 29px; font-weight: 400; }
  .global-header span { font-weight: 200; }

  /* Secondary Module Header (branco, texto azul, borda inferior e sombra leve) */
  .module-header { background: var(--white); border-bottom: 1px solid var(--og1-grey-300); box-shadow: var(--card-shadow);
    display: flex; flex-wrap: wrap; gap: var(--s4) var(--s6); align-items: center; justify-content: space-between;
    padding: var(--s5) var(--s6); position: relative; z-index: 1; }
  .module-header h1 { margin: 0; color: var(--og1-blue); font-size: 30px; line-height: 39px; font-weight: 400; }
  .module-header p { margin: var(--s1) 0 0; color: var(--og1-grey-700); font-size: 16px; line-height: 20px; }
  .totals { display: flex; gap: var(--s6); }
  .totals div { text-align: right; }
  .totals b { display: block; font-size: 40px; line-height: 48px; font-weight: 200; color: var(--pure-black); font-variant-numeric: tabular-nums; }
  .totals span { font-size: 14px; line-height: 19px; color: var(--og1-grey-700); }

  /* Área do mapa: gradiente do hero */
  main { background: var(--hero-gradient); padding: var(--s4) var(--s3); }
  #dash { width: 100%; height: auto; display: block; max-height: calc(100vh - 190px); }

  /* Mapa */
  .grade { fill: none; stroke: var(--og1-grey-300); stroke-width: .6; opacity: .6; }
  .sombra { fill: var(--pure-black); opacity: .10; }
  .pais { fill: var(--og1-grey-300); stroke: var(--white); stroke-width: .8; stroke-linejoin: round; }
  .pais.projeto { fill: var(--og1-blue); }
  .pais.ccav.projeto { fill: var(--og1-grey-700); }
  .pais.on { stroke: var(--pure-black); stroke-width: 1.8; }

  /* Sedes: linha, marcador e caixa de KPI */
  .leader { stroke: var(--og1-grey-700); stroke-width: 1; fill: none; opacity: .8; }
  .site.on .leader { stroke: var(--pure-black); stroke-width: 1.8; opacity: 1; }
  .site .dot { stroke: var(--white); stroke-width: 2; }
  .site.main .dot { fill: var(--og1-blue); } .site.ccav .dot { fill: var(--og1-grey-700); }
  .site .halo { fill: none; stroke-width: 1.2; opacity: .45; }
  .site.main .halo { stroke: var(--og1-blue); } .site.ccav .halo { stroke: var(--og1-grey-700); }
  .city { font-size: 14px; font-weight: 400; fill: var(--pure-black); paint-order: stroke; stroke: var(--white); stroke-width: 3px; stroke-linejoin: round; }
  .box { fill: var(--white); stroke: var(--og1-grey-300); stroke-width: 1; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .11)); }
  .site.on .box { stroke: var(--og1-blue); stroke-width: 2; }
  .accent.main { fill: var(--og1-blue); } .accent.ccav { fill: var(--og1-grey-700); }
  .t-country { font-size: 15px; font-weight: 600; fill: var(--pure-black); }
  .t-city { font-size: 13px; font-weight: 400; fill: var(--og1-grey-700); }
  .t-po { font-size: 12px; font-weight: 400; fill: var(--og1-grey-700); }
  .t-val { font-size: 19px; font-weight: 400; fill: var(--pure-black); font-variant-numeric: tabular-nums; }
  .t-lbl { font-size: 11px; font-weight: 400; fill: var(--og1-grey-700); }
  .t-sub { font-size: 10px; font-weight: 400; fill: var(--grey-500); font-variant-numeric: tabular-nums; }
  .site:focus { outline: none; }
  .site:focus-visible .box { stroke: var(--pure-black); stroke-width: 3; }

  .legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); padding: var(--s4) var(--s6) var(--s5);
    font-size: 14px; line-height: 19px; color: var(--og1-grey-700); border-top: 1px solid var(--og1-grey-300); }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: var(--s2); vertical-align: -1px; }
</style>

      <g id="cap-PR" class="capital ccav" data-cidade="San Juan" data-pais="PR" transform="translate(566.0 203.5)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#e6aa3c" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" display="none">San Juan</text></g>
      <g id="cap-CO" class="capital " data-cidade="Bogotá" data-pais="CO" transform="translate(483.8 348.9)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" display="none">Bogotá</text></g>
      <g id="cap-VE" class="capital ccav" data-cidade="Caracas" data-pais="VE" transform="translate(557.8 288.8)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#e6aa3c" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Caracas</text></g>
      <g id="cap-GY" class="capital " data-cidade="Georgetown" data-pais="GY" transform="translate(648.1 327.2)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" display="none">Georgetown</text></g>
      <g id="cap-SR" class="capital " data-cidade="Paramaribo" data-pais="SR" transform="translate(678.7 337.1)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" display="none">Paramaribo</text></g>
      <g id="cap-EC" class="capital " data-cidade="Quito" data-pais="EC" transform="translate(438.3 399.5)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Quito</text></g>
      <g id="cap-PE" class="capital " data-cidade="Lima" data-pais="PE" transform="translate(453.1 523.0)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" display="none">Lima</text></g>
      <g id="cap-BR" class="capital " data-cidade="Brasília" data-pais="BR" transform="translate(754.3 562.8)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Brasília</text></g>
      <g id="cap-BO" class="capital " data-cidade="La Paz" data-pais="BO" transform="translate(544.9 570.5)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">La Paz</text></g>
      <g id="cap-PY" class="capital " data-cidade="Assunção" data-pais="PY" transform="translate(654.1 667.4)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Assunção</text></g>
      <g id="cap-CL" class="capital " data-cidade="Santiago" data-pais="CL" transform="translate(518.9 764.6)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Santiago</text></g>
      <g id="cap-AR" class="capital " data-cidade="Buenos Aires" data-pais="AR" transform="translate(645.9 779.0)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="-8" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Buenos Aires</text></g>
      <g id="cap-UY" class="capital " data-cidade="Montevidéu" data-pais="UY" transform="translate(668.8 782.8)"><circle class="halo" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45"/><circle class="dot" r="4.5" fill="#ffffff" stroke="#0d1624" stroke-width="1.8"/><text class="rotulo" x="9" y="16" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Montevidéu</text></g>
  </g>
  </g>
  <g id="sedes"></g>
</svg>
</main>
<div class="legend">
  <span><i style="background:var(--og1-blue)"></i>Países com projetos</span>
  <span><i style="background:var(--og1-grey-700)"></i>CCAV (Venezuela, Costa Rica e Caribe)</span>
  <span><i style="background:var(--og1-grey-300)"></i>Demais países</span>
  <span>Cidades sede = capitais (premissa). Valores de exemplo, não oficiais.</span>
</div>

<script>
/* ===== LAYOUT DO MAPA (posições das caixas por código ISO alpha-2) =====
   side: 'L' caixa à esquerda, 'R' à direita | slot: posição vertical (0..5)
   lbl: posição do nome da cidade no mapa ('r' direita, 'l' esquerda, 'b' abaixo) */
const LAYOUT = {
  MX: { grupo: 'main', side: 'L', slot: 0, lbl: 'r' },
  CR: { grupo: 'ccav', side: 'L', slot: 1, lbl: 'l' },
  EC: { grupo: 'main', side: 'L', slot: 2, lbl: 'l' },
  BO: { grupo: 'main', side: 'L', slot: 3, lbl: 'l' },
  CL: { grupo: 'main', side: 'L', slot: 4, lbl: 'l' },
  DO: { grupo: 'ccav', side: 'R', slot: 0, lbl: 'r' },
  VE: { grupo: 'ccav', side: 'R', slot: 1, lbl: 'r' },
  BR: { grupo: 'main', side: 'R', slot: 2, lbl: 'r' },
  PY: { grupo: 'main', side: 'R', slot: 3, lbl: 'r' },
  AR: { grupo: 'main', side: 'R', slot: 4, lbl: 'l' },
  UY: { grupo: 'main', side: 'R', slot: 5, lbl: 'b' }
};

// Fallback local idêntico a latam-datalake-info.json (permite abrir via file:// sem servidor web)
const FALLBACK_DATA = [
  { "country-code": "BR", "country-name": "Brasil", "url-flag": "https://flagcdn.com/w80/br.png", "city-office": "Brasília", "product-owner-name": "Carlos Eduardo Silva", "qty-stage": 640, "qty-core": 486, "qty-mart": 142, "list-mart": ["mart_sales_br", "mart_commercial_excellence", "mart_supply_chain", "mart_patient_journey", "mart_finance_controlling", "mart_medical_affairs"], "storage-mart-gb": 68400, "storate-core-gb": 220774 },
  { "country-code": "AR", "country-name": "Argentina", "url-flag": "https://flagcdn.com/w80/ar.png", "city-office": "Buenos Aires", "product-owner-name": "Martín Gómez", "qty-stage": 340, "qty-core": 257, "qty-mart": 78, "list-mart": ["mart_sales_ar", "mart_market_access", "mart_supply_chain", "mart_finance_ar", "mart_crm_engagement"], "storage-mart-gb": 31200, "storate-core-gb": 99430 },
  { "country-code": "MX", "country-name": "México", "url-flag": "https://flagcdn.com/w80/mx.png", "city-office": "Cidade do México", "product-owner-name": "Alejandra Hernández", "qty-stage": 290, "qty-core": 212, "qty-mart": 64, "list-mart": ["mart_sales_mx", "mart_omnicanal_crm", "mart_patient_support", "mart_supply_chain", "mart_finance_mx"], "storage-mart-gb": 27600, "storate-core-gb": 88473 },
  { "country-code": "CL", "country-name": "Chile", "url-flag": "https://flagcdn.com/w80/cl.png", "city-office": "Santiago", "product-owner-name": "Camila Rojas", "qty-stage": 180, "qty-core": 131, "qty-mart": 42, "list-mart": ["mart_sales_cl", "mart_hospital_tenders", "mart_supply_chain", "mart_finance_cl"], "storage-mart-gb": 14200, "storate-core-gb": 43827 },
  { "country-code": "EC", "country-name": "Equador", "url-flag": "https://flagcdn.com/w80/ec.png", "city-office": "Quito", "product-owner-name": "Diego Andrade", "qty-stage": 98, "qty-core": 73, "qty-mart": 24, "list-mart": ["mart_sales_ec", "mart_commercial_ec", "mart_inventory_ec"], "storage-mart-gb": 6800, "storate-core-gb": 21811 },
  { "country-code": "UY", "country-name": "Uruguai", "url-flag": "https://flagcdn.com/w80/uy.png", "city-office": "Montevidéu", "product-owner-name": "Lucía Fernández", "qty-stage": 84, "qty-core": 62, "qty-mart": 19, "list-mart": ["mart_sales_uy", "mart_diagnostics_uy", "mart_finance_uy"], "storage-mart-gb": 4900, "storate-core-gb": 14848 },
  { "country-code": "VE", "country-name": "Venezuela", "url-flag": "https://flagcdn.com/w80/ve.png", "city-office": "Caracas", "product-owner-name": "Andrés Mendoza", "qty-stage": 76, "qty-core": 57, "qty-mart": 16, "list-mart": ["mart_sales_ve", "mart_distribution_ve", "mart_regulatory_ccav"], "storage-mart-gb": 4100, "storate-core-gb": 13209 },
  { "country-code": "CR", "country-name": "Costa Rica", "url-flag": "https://flagcdn.com/w80/cr.png", "city-office": "San José", "product-owner-name": "Valeria Vargas", "qty-stage": 65, "qty-core": 48, "qty-mart": 15, "list-mart": ["mart_sales_ccav", "mart_hub_central_america", "mart_patient_access_cr"], "storage-mart-gb": 3200, "storate-core-gb": 9932 },
  { "country-code": "PY", "country-name": "Paraguai", "url-flag": "https://flagcdn.com/w80/py.png", "city-office": "Assunção", "product-owner-name": "Rodrigo Benítez", "qty-stage": 56, "qty-core": 41, "qty-mart": 12, "list-mart": ["mart_sales_py", "mart_distributor_sellout", "mart_finance_py"], "storage-mart-gb": 2700, "storate-core-gb": 8601 },
  { "country-code": "BO", "country-name": "Bolívia", "url-flag": "https://flagcdn.com/w80/bo.png", "city-office": "La Paz", "product-owner-name": "Fernando Quispe", "qty-stage": 48, "qty-core": 35, "qty-mart": 10, "list-mart": ["mart_sales_bo", "mart_commercial_bo", "mart_supply_bo"], "storage-mart-gb": 1950, "storate-core-gb": 6348 },
  { "country-code": "DO", "country-name": "Caribe", "url-flag": "https://flagcdn.com/w80/do.png", "city-office": "Santo Domingo", "product-owner-name": "Gabriela Reyes", "qty-stage": 40, "qty-core": 29, "qty-mart": 9, "list-mart": ["mart_sales_caribe", "mart_island_distribution", "mart_finance_ccav"], "storage-mart-gb": 1600, "storate-core-gb": 5222 }
];

const MAP = { x: 295, y: 37, scale: 0.69 };            // posição/escala do mapa no painel (mesmos valores do transform)
const BOX = { w: 280, h: 118, gap: 16, top: 28, leftX: 6, rightX: 994 };
const NS = 'http://www.w3.org/2000/svg';
const nf = new Intl.NumberFormat('pt-BR');
const fmtTB = gb => (gb / 1024).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

// posição da capital no painel, lida do próprio mapa (g#cap-XX)
function capPos(a2) {
  const g = document.getElementById('cap-' + a2);
  const m = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/.exec(g.getAttribute('transform'));
  return [MAP.x + parseFloat(m[1]) * MAP.scale, MAP.y + parseFloat(m[2]) * MAP.scale];
}

async function loadDatalakeInfo() {
  try {
    const res = await fetch('./latam-datalake-info.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (_) {
    return FALLBACK_DATA;
  }
}

function mapSites(rawList) {
  return rawList.map(item => {
    const a2 = item['country-code'];
    const cfg = LAYOUT[a2] || { grupo: 'main', side: 'R', slot: 0, lbl: 'r' };
    const storageMartGB = Number(item['storage-mart-gb'] || 0);
    const storageCoreGB = Number(item['storate-core-gb'] ?? item['storage-core-gb'] ?? 0);
    return {
      a2,
      pais: item['country-name'],
      flag: item['url-flag'],
      cidade: item['city-office'],
      po: item['product-owner-name'],
      qtyStage: Number(item['qty-stage'] || 0),
      qtyCore: Number(item['qty-core'] || 0),
      qtyMart: Number(item['qty-mart'] || 0),
      listMart: Array.isArray(item['list-mart']) ? item['list-mart'] : [],
      storageMartGB,
      storageCoreGB,
      totalStorageGB: storageMartGB + storageCoreGB,
      ...cfg
    };
  });
}

function renderTotals(sites) {
  const sum = k => sites.reduce((a, s) => a + s[k], 0);
  document.getElementById('totals').innerHTML = `
    <div><b>${nf.format(sum('qtyStage'))}</b><span>Tabelas Stage</span></div>
    <div><b>${nf.format(sum('qtyCore'))}</b><span>Tabelas Core</span></div>
    <div><b>${nf.format(sum('qtyMart'))}</b><span>Data Marts</span></div>
    <div><b>${fmtTB(sum('totalStorageGB'))} TB</b><span>Storage Total (Core + Mart)</span></div>`;
}

async function init() {
  const raw = await loadDatalakeInfo();
  const sites = mapSites(raw);
  renderTotals(sites);

  const root = document.getElementById('sedes');
  root.innerHTML = '';

  sites.forEach(s => {
    const pais = document.getElementById(s.a2);
    if (pais) { pais.classList.add('projeto'); if (s.grupo === 'ccav') pais.classList.add('ccav'); }

    const [px, py] = capPos(s.a2);
    const bx = s.side === 'L' ? BOX.leftX : BOX.rightX;
    const by = BOX.top + s.slot * (BOX.h + BOX.gap);
    const ex = s.side === 'L' ? bx + BOX.w : bx;
    const ey = by + BOX.h / 2;
    const elbow = s.side === 'L' ? ex + 24 : ex - 24;

    const g = el('g', { class: 'site ' + s.grupo, tabindex: 0 }, root);
    el('title', {}, g, `${s.pais} (${s.cidade})\nPO: ${s.po}\nMarts (${s.listMart.length}): ${s.listMart.join(', ')}\nStorage Core: ${fmtTB(s.storageCoreGB)} TB (${nf.format(s.storageCoreGB)} GB)\nStorage Mart: ${fmtTB(s.storageMartGB)} TB (${nf.format(s.storageMartGB)} GB)`);
    el('polyline', { class: 'leader', points: `${ex},${ey} ${elbow},${ey} ${px},${py}` }, g);
    el('circle', { class: 'halo', cx: px, cy: py, r: 9 }, g);
    el('circle', { class: 'dot', cx: px, cy: py, r: 5.5 }, g);
    const L = { r: [px + 10, py - 9, 'start'], l: [px - 10, py - 9, 'end'], b: [px + 10, py + 20, 'start'] }[s.lbl];
    el('text', { class: 'city', x: L[0], y: L[1], 'text-anchor': L[2] }, g, s.cidade);

    const b = el('g', { transform: `translate(${bx},${by})` }, g);
    el('rect', { class: 'box', width: BOX.w, height: BOX.h, rx: 6 }, b);
    el('rect', { class: 'accent ' + s.grupo, width: 4, height: BOX.h - 24, x: 0, y: 12 }, b);

    // Bandeira, País, Cidade e Product Owner
    el('image', { href: s.flag, x: 14, y: 11, width: 20, height: 14, preserveAspectRatio: 'xMidYMid slice' }, b);
    el('text', { class: 't-country', x: 40, y: 23 }, b, s.pais);
    el('text', { class: 't-city', x: BOX.w - 12, y: 23, 'text-anchor': 'end' }, b, s.cidade);
    el('text', { class: 't-po', x: 14, y: 41 }, b, `PO: ${s.po}`);
    el('line', { x1: 14, y1: 49, x2: BOX.w - 12, y2: 49, stroke: 'var(--og1-grey-300)', 'stroke-width': 0.8 }, b);

    // 4 Colunas de KPI do JSON: Stage | Core | Mart | Storage Total
    [
      [nf.format(s.qtyStage), 'Stage', '', 14],
      [nf.format(s.qtyCore), 'Core', `${fmtTB(s.storageCoreGB)} TB`, 74],
      [nf.format(s.qtyMart), 'Mart', `${fmtTB(s.storageMartGB)} TB`, 138],
      [`${fmtTB(s.totalStorageGB)} TB`, 'Storage Total', `${nf.format(s.totalStorageGB)} GB`, 200]
    ].forEach(([v, l, sub, x]) => {
      el('text', { class: 't-val', x, y: 74 }, b, v);
      el('text', { class: 't-lbl', x, y: 92 }, b, l);
      if (sub) el('text', { class: 't-sub', x, y: 107 }, b, sub);
    });

    const on = f => { g.classList.toggle('on', f); if (pais) pais.classList.toggle('on', f); };
    g.addEventListener('mouseenter', () => on(true));
    g.addEventListener('mouseleave', () => on(false));
    g.addEventListener('focus', () => on(true));
    g.addEventListener('blur', () => on(false));
  });
}
init();
</script>
</body>
</html>
